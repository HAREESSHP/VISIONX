<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionX Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --pink: #ec4899;
      --green: #10b981;
      --orange: #f97316;
      --red: #ef4444;
      --bg: #0a0a14;
      --card: #12122a;
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.5);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* ── Login screen ── */
    #login-screen {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(99,102,241,0.15) 0%, transparent 70%);
    }
    .login-box {
      background:var(--card); border-radius:24px; padding:50px 44px;
      max-width:400px; width:100%; border:1px solid var(--border);
      box-shadow:0 30px 80px rgba(0,0,0,0.5);
    }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo h1 { font-size:1.8rem; font-weight:800;
      background:linear-gradient(135deg,#6366f1,#ec4899);
      background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .login-logo p { color:var(--muted); font-size:.85rem; margin-top:6px; }
    .login-box label { display:block; color:var(--muted); font-size:.82rem; font-weight:600;
      text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .login-box input {
      width:100%; background:rgba(255,255,255,0.05); border:1.5px solid var(--border);
      border-radius:12px; padding:14px 18px; color:#fff; font-family:inherit;
      font-size:.95rem; outline:none; transition:.3s;
    }
    .login-box input:focus { border-color:#6366f1; }
    .login-btn {
      width:100%; margin-top:24px; padding:15px;
      background:linear-gradient(135deg,#6366f1,#ec4899);
      color:#fff; border:none; border-radius:12px;
      font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; transition:.3s;
    }
    .login-btn:hover { opacity:.9; transform:translateY(-2px); }
    .login-error { color:var(--red); text-align:center; font-size:.85rem; margin-top:12px; display:none; }

    /* ── Dashboard ── */
    #dashboard { display:none; }
    .topbar {
      background:rgba(18,18,42,0.95); backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border); padding:18px 32px;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:100;
    }
    .topbar-brand { font-size:1.35rem; font-weight:800;
      background:linear-gradient(135deg,#6366f1,#ec4899);
      background-clip:text; -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .topbar-right { display:flex; align-items:center; gap:16px; }
    .refresh-btn {
      background:rgba(99,102,241,0.15); border:1px solid rgba(99,102,241,0.35);
      color:#a5b4fc; padding:9px 20px; border-radius:50px;
      font-family:inherit; font-size:.85rem; font-weight:600; cursor:pointer; transition:.3s;
    }
    .refresh-btn:hover { background:rgba(99,102,241,0.25); }
    .logout-btn {
      background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3);
      color:#ef4444; padding:9px 20px; border-radius:50px;
      font-family:inherit; font-size:.85rem; font-weight:600; cursor:pointer; transition:.3s;
    }
    .logout-btn:hover { background:rgba(239,68,68,0.2); }

    .main { padding:32px; max-width:1300px; margin:0 auto; }

    /* Stats grid */
    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:36px; }
    .stat-card {
      background:var(--card); border-radius:18px; padding:28px 24px;
      border:1px solid var(--border);
      display:flex; align-items:center; gap:20px;
    }
    .stat-icon {
      width:52px; height:52px; border-radius:14px;
      display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0;
    }
    .stat-icon.purple { background:rgba(99,102,241,0.15); color:#6366f1; }
    .stat-icon.green  { background:rgba(16,185,129,0.15); color:#10b981; }
    .stat-icon.orange { background:rgba(249,115,22,0.15);  color:#f97316; }
    .stat-icon.pink   { background:rgba(236,72,153,0.15);  color:#ec4899; }
    .stat-val { font-size:2rem; font-weight:800; line-height:1; }
    .stat-lbl { color:var(--muted); font-size:.82rem; margin-top:4px; }

    /* Table */
    .table-section { background:var(--card); border-radius:20px; border:1px solid var(--border); overflow:hidden; }
    .table-header {
      padding:24px 28px; display:flex; align-items:center;
      justify-content:space-between; border-bottom:1px solid var(--border);
    }
    .table-header h2 { font-size:1.1rem; font-weight:700; }
    .search-box {
      background:rgba(255,255,255,0.05); border:1.5px solid var(--border);
      border-radius:50px; padding:10px 20px; color:#fff; font-family:inherit;
      font-size:.88rem; outline:none; width:260px; transition:.3s;
    }
    .search-box:focus { border-color:#6366f1; }
    .search-box::placeholder { color:var(--muted); }

    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    thead tr { background:rgba(255,255,255,0.03); }
    th {
      padding:14px 20px; text-align:left; font-size:.78rem;
      font-weight:700; text-transform:uppercase; letter-spacing:1.5px;
      color:var(--muted); white-space:nowrap;
    }
    td {
      padding:16px 20px; font-size:.88rem; border-top:1px solid var(--border);
      white-space:nowrap;
    }
    tr:hover td { background:rgba(99,102,241,0.04); }
    .tid  { color:#f97316; font-weight:700; font-family:monospace; font-size:.9rem; }
    .badge {
      display:inline-flex; align-items:center; gap:5px;
      padding:5px 14px; border-radius:50px; font-size:.78rem; font-weight:700;
    }
    .badge.paid    { background:rgba(16,185,129,0.15); color:#10b981; border:1px solid rgba(16,185,129,0.3); }
    .badge.pending { background:rgba(249,115,22,0.15);  color:#f97316; border:1px solid rgba(249,115,22,0.3); }
    .badge.failed  { background:rgba(239,68,68,0.15);   color:#ef4444; border:1px solid rgba(239,68,68,0.3); }
    .badge.scanned { background:rgba(99,102,241,0.15);  color:#a5b4fc; border:1px solid rgba(99,102,241,0.3); }
    .empty { text-align:center; padding:60px 20px; color:var(--muted); }
    .loading { text-align:center; padding:60px 20px; color:var(--muted); }

    .approve-btn {
      background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.4);
      color:#10b981; padding:6px 14px; border-radius:8px; display:inline-flex; align-items:center; gap:6px;
      font-family:inherit; font-size:.78rem; font-weight:700; cursor:pointer; transition:.3s; cursor:pointer;
    }
    .approve-btn:hover { background:rgba(16,185,129,0.3); }
    .approve-btn:disabled { opacity:0.5; cursor:not-allowed; }

    @media(max-width:900px) {
      .stats-grid { grid-template-columns:1fr 1fr; }
      .main { padding:16px; }
    }
    @media(max-width:500px) {
      .stats-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<!-- ── Login Screen ────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <h1>VisionX</h1>
      <p>Admin Panel — Secure Access</p>
    </div>
    <label for="admin-key-input">Admin Key</label>
    <input type="password" id="admin-key-input" placeholder="Enter admin key" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()"><i class="fas fa-lock"></i> Login</button>
    <p class="login-error" id="login-error">Invalid admin key. Try again.</p>
  </div>
</div>

<!-- ── Dashboard ──────────────────────────── -->
<div id="dashboard">
  <div class="topbar">
    <span class="topbar-brand">🛡 VisionX Admin</span>
    <div class="topbar-right">
      <span id="last-updated" style="color:rgba(255,255,255,0.35);font-size:.8rem;"></span>
      <button class="refresh-btn" onclick="loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <div class="main">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon purple"><i class="fas fa-ticket-alt"></i></div>
        <div>
          <div class="stat-val" id="s-paid">—</div>
          <div class="stat-lbl">Tickets Sold</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-rupee-sign"></i></div>
        <div>
          <div class="stat-val" id="s-revenue">—</div>
          <div class="stat-lbl">Total Revenue</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><i class="fas fa-qrcode"></i></div>
        <div>
          <div class="stat-val" id="s-scanned">—</div>
          <div class="stat-lbl">Entries Scanned</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon pink"><i class="fas fa-clock"></i></div>
        <div>
          <div class="stat-val" id="s-pending">—</div>
          <div class="stat-lbl">Pending</div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-section">
      <div class="table-header">
        <h2>All Registrations</h2>
        <input type="text" class="search-box" id="search-input" placeholder="Search by name, email, ticket..." oninput="filterTable()">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Ticket ID</th>
              <th>Name</th>
              <th>Roll No</th>
              <th>Email</th>
              <th>Phone</th>
              <th>College</th>
              <th>Department</th>
              <th>Payment ID</th>
              <th>Status</th>
              <th>Scanned</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="12" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  let adminKey = '';
  let allTickets = [];

  function doLogin() {
    adminKey = document.getElementById('admin-key-input').value.trim();
    if (!adminKey) return;

    fetch('/api/admin/stats', { headers: { 'x-admin-key': adminKey } })
      .then(r => {
        if (!r.ok) throw new Error('Unauthorized');
        return r.json();
      })
      .then(() => {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadData();
      })
      .catch(() => {
        document.getElementById('login-error').style.display = 'block';
      });
  }

  function logout() {
    adminKey = '';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('admin-key-input').value = '';
    document.getElementById('login-error').style.display = 'none';
  }

  async function loadData() {
    await Promise.all([loadStats(), loadTickets()]);
    document.getElementById('last-updated').textContent =
      'Updated: ' + new Date().toLocaleTimeString();
  }

  async function loadStats() {
    const r = await fetch('/api/admin/stats', { headers: { 'x-admin-key': adminKey } });
    const d = await r.json();
    document.getElementById('s-paid').textContent    = d.paid;
    document.getElementById('s-revenue').textContent = '₹' + (d.revenue || 0).toLocaleString();
    document.getElementById('s-scanned').textContent = d.scanned;
    document.getElementById('s-pending').textContent = d.pending;
  }

  async function loadTickets() {
    const r = await fetch('/api/admin/tickets', { headers: { 'x-admin-key': adminKey } });
    allTickets = await r.json();
    renderTable(allTickets);
  }

  function renderTable(tickets) {
    const tbody = document.getElementById('table-body');
    if (!tickets.length) {
      tbody.innerHTML = '<tr><td colspan="12" class="empty">No registrations yet.</td></tr>';
      return;
    }
    tbody.innerHTML = tickets.map((t, i) => `
      <tr>
        <td style="color:rgba(255,255,255,0.3)">${i + 1}</td>
        <td class="tid">${t.ticketId}</td>
        <td>${t.name}</td>
        <td>${t.rollno}</td>
        <td style="color:#a5b4fc">${t.email}</td>
        <td>${t.phone}</td>
        <td>${t.college}</td>
        <td>${t.department}</td>
        <td style="color:rgba(255,255,255,0.4);font-size:.8rem;font-family:monospace">${t.paymentId || '—'}</td>
        <td><span class="badge ${t.status}">${t.status.toUpperCase()}</span></td>
        <td>${t.scanned ? '<span class="badge scanned">SCANNED</span>' : '<span style="color:rgba(255,255,255,0.3)">—</span>'}</td>
        <td style="color:rgba(255,255,255,0.4);font-size:.82rem">${new Date(t.createdAt).toLocaleDateString('en-IN', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
        <td>
          ${t.status === 'pending'
            ? `<button class="approve-btn" onclick="approveTicket('${t.ticketId}', this)"><i class="fas fa-check"></i> Approve</button>`
            : '<span style="color:rgba(255,255,255,0.2)">—</span>'}
        </td>
      </tr>`).join('');
  }

  function filterTable() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = allTickets.filter(t =>
      t.name.toLowerCase().includes(q) ||
      t.rollno.toLowerCase().includes(q) ||
      t.email.toLowerCase().includes(q) ||
      t.ticketId.toLowerCase().includes(q) ||
      t.phone.includes(q) ||
      t.college.toLowerCase().includes(q)
    );
    renderTable(filtered);
  }

  async function approveTicket(ticketId, btn) {
    if (!confirm('Are you sure you want to approve this ticket manually?\\n\\nThey will instantly receive an email with their valid QR code.')) return;
    
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Approving...';
    btn.disabled = true;

    try {
      const r = await fetch('/api/admin/approve-ticket', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
        body: JSON.stringify({ ticketId })
      });
      const data = await r.json();

      if (!r.ok) throw new Error(data.error || 'Failed to approve');
      
      alert('✅ Ticket approved successfully! Email sent to the user.');
      loadData(); // refresh the table
    } catch (err) {
      alert('❌ Error: ' + err.message);
      btn.innerHTML = originalText;
      btn.disabled = false;
    }
  }

  // Auto-refresh every 60s
  setInterval(() => { if (adminKey) loadData(); }, 60000);
</script>
</body>
</html>
